name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_BUILD_PARALLEL_LEVEL: "1"
  CMAKE_GENERATOR: "Visual Studio 17 2022"
  RUST_VERSION: "1.95.0"
  MONO_VERSION: "6.12.0.199"
  PYTHON_VERSION: "3.11"

jobs:
  rust-tests:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Local CI mirror (Rust/FFI/fuzz/icons)
        working-directory: engine
        shell: pwsh
        run: ./scripts/ci_local.ps1 -SkipBuild

  csharp-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Mono
        shell: pwsh
        run: |
          choco install mono --version=${{ env.MONO_VERSION }} --no-progress -y
          & "C:\Program Files\Mono\bin\mono.exe" --version

      - name: Compile editor C# scripts
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File engine/scripts/build_mono.ps1

      - name: Verify generated icon tables are current
        working-directory: engine
        shell: pwsh
        run: |
          python scripts/gen_icons.py
          git diff --exit-code -- ui/src/icons.rs scripts/IconIds.cs

  package-windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Install Mono
        shell: pwsh
        run: |
          choco install mono --version=${{ env.MONO_VERSION }} --no-progress -y

      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build editor
        working-directory: engine
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          cargo build -j 1 --release --features mono
          powershell -ExecutionPolicy Bypass -File scripts/build_mono.ps1

      - name: Build MSI
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          powershell -ExecutionPolicy Bypass -File installer/windows/build_msi.ps1 -SkipBuild

      - uses: actions/upload-artifact@v4
        with:
          name: hezhou-editor-windows-msi
          path: dist/*.msi

  package-linux:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config python3 \
            libvulkan-dev libglfw3-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxinerama-dev \
            mono-devel

      - name: Build editor
        working-directory: engine
        run: cargo build -j 1 --release --features mono

      - name: Build DEB
        run: bash installer/linux/build_deb.sh --skip-build

      - uses: actions/upload-artifact@v4
        with:
          name: hezhou-editor-linux-deb
          path: dist/*.deb
