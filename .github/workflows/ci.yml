name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_BUILD_PARALLEL_LEVEL: "1"
  RUST_VERSION: "1.95.0"
  MONO_VERSION: "6.12.0.199"
  PYTHON_VERSION: "3.11"

jobs:
  rust-tests:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Mono 6.12
        shell: pwsh
        run: |
          $msi = Join-Path $env:TEMP "mono-6.12.0.199-x64.msi"
          Invoke-WebRequest "https://download.mono-project.com/archive/6.12.0/windows-installer/mono-6.12.0.199-x64-0.msi" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait
          & "C:\Program Files\Mono\bin\mono.exe" --version

      - name: Local CI mirror (Rust/FFI/fuzz/icons)
        working-directory: engine
        shell: pwsh
        run: ./scripts/ci_local.ps1 -SkipBuild

  csharp-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Mono 6.12
        shell: pwsh
        run: |
          $msi = Join-Path $env:TEMP "mono-6.12.0.199-x64.msi"
          Invoke-WebRequest "https://download.mono-project.com/archive/6.12.0/windows-installer/mono-6.12.0.199-x64-0.msi" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait
          & "C:\Program Files\Mono\bin\mono.exe" --version

      - name: Compile editor C# scripts
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File engine/scripts/build_mono.ps1

      - name: Verify generated icon tables are current
        working-directory: engine
        shell: pwsh
        run: |
          python scripts/gen_icons.py
          git diff --exit-code -- ui/src/icons.rs scripts/IconIds.cs

  package-windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Install Mono 6.12
        shell: pwsh
        run: |
          $msi = Join-Path $env:TEMP "mono-6.12.0.199-x64.msi"
          Invoke-WebRequest "https://download.mono-project.com/archive/6.12.0/windows-installer/mono-6.12.0.199-x64-0.msi" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait
          & "C:\Program Files\Mono\bin\mono.exe" --version

      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build editor
        working-directory: engine
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          cargo build -j 1 --release --features mono
          powershell -ExecutionPolicy Bypass -File scripts/build_mono.ps1

      - name: Build and sign MSIX
        shell: pwsh
        run: |
          $dist = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Hezhou-Editor" `
            -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy Exportable -NotAfter (Get-Date).AddYears(5)
          $pwd = ConvertTo-SecureString "hezhou-msix" -AsPlainText -Force
          $pfx = Join-Path $env:RUNNER_TEMP "hezhou-msix.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pwd | Out-Null
          Export-Certificate -Cert $cert -FilePath (Join-Path $dist "HezhouEditor.cer") | Out-Null
          powershell -ExecutionPolicy Bypass -File installer/windows/build_msix.ps1 -SkipBuild `
            -CertificatePath $pfx -CertificatePassword "hezhou-msix"

      - name: Build MSI
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          powershell -ExecutionPolicy Bypass -File installer/windows/build_msi.ps1 -SkipBuild

      - uses: actions/upload-artifact@v4
        with:
          name: hezhou-editor-windows-msix
          path: |
            dist/*.msix
            dist/*.cer
            dist/*.msi

  package-linux:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    env:
      CMAKE_GENERATOR: Ninja
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 \
            libvulkan-dev libglfw3-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxinerama-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libx11-xcb-dev libxcb1-dev libxcb-randr0-dev libxcb-xinerama0-dev \
            libxcb-xkb-dev libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev \
            mono-devel libmono-2.0-dev

      - name: Build editor
        working-directory: engine
        run: cargo build -j 1 --release --features mono

      - name: Build DEB
        run: bash installer/linux/build_deb.sh --skip-build

      - uses: actions/upload-artifact@v4
        with:
          name: hezhou-editor-linux-deb
          path: dist/*.deb

  player-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Install Mono 6.12
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Join-Path $env:TEMP "mono-6.12.0.199-x64.msi"
          Invoke-WebRequest "https://download.mono-project.com/archive/6.12.0/windows-installer/mono-6.12.0.199-x64-0.msi" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait
          & "C:\Program Files\Mono\bin\mono.exe" --version

      - name: Install Mono (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mono-devel libmono-2.0-dev

      - name: Player tests
        working-directory: engine
        shell: pwsh
        run: cargo test -p hezhou-player

      - name: Build player runtime
        working-directory: engine
        shell: pwsh
        run: cargo build -p hezhou-player --release

      - name: Build and validate player fixture
        shell: pwsh
        run: |
          $target = if ($env:RUNNER_OS -eq "Windows") { "windows" } else { "linux" }
          $suffix = if ($env:RUNNER_OS -eq "Windows") { ".exe" } else { "" }
          $config = "engine/player/tests/fixtures/minimal/build-config.json"
          python -c "import json; p='$config'; d=json.load(open(p)); d['target']='$target'; open(p,'w').write(json.dumps(d,indent=2))"
          $exe = "engine/target/release/hezhou-player$suffix"
          $builder = "engine/target/release/hezhou-player-build$suffix"
          & $builder --config $config `
            --cook engine/player/tests/fixtures/minimal/cook-manifest.json `
            --assets-dir engine/player/tests/fixtures/minimal/assets `
            --scripts-dir engine/player/tests/fixtures/minimal/scripts `
            --runtime-dir engine/player/tests/fixtures/minimal/runtime `
            --exe $exe --build-out dist/player-fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pkg = "dist/player-fixture/$target"
          & "$pkg/minimal-fixture$suffix" --validate --player-root $pkg --log-dir "$env:RUNNER_TEMP/hezhou-player-logs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: hezhou-player-fixture-${{ matrix.os }}
          path: dist/player-fixture/**

  player-window-host:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Install Mono 6.12
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Join-Path $env:TEMP "mono-6.12.0.199-x64.msi"
          Invoke-WebRequest "https://download.mono-project.com/archive/6.12.0/windows-installer/mono-6.12.0.199-x64-0.msi" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait
          & "C:\Program Files\Mono\bin\mono.exe" --version

      - name: Install Mono (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mono-devel libmono-2.0-dev

      - name: Install Linux window/Vulkan dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             build-essential cmake ninja-build pkg-config             libvulkan-dev libglfw3-dev libx11-dev libxrandr-dev             libxi-dev libxcursor-dev libxinerama-dev libxkbcommon-dev             libxkbcommon-x11-dev libwayland-dev wayland-protocols libdecor-0-dev             libx11-xcb-dev libxcb1-dev

      - name: Build Player window host
        working-directory: engine
        shell: pwsh
        run: cargo build -p hezhou-player --features window-host

      - name: Test Player host contracts
        working-directory: engine
        shell: pwsh
        run: cargo test -p hezhou-player --features window-host

  package-player:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             build-essential cmake ninja-build pkg-config python3             libvulkan-dev libglfw3-dev libx11-dev libxrandr-dev             libxi-dev libxcursor-dev libxinerama-dev libxkbcommon-dev             libxkbcommon-x11-dev libwayland-dev wayland-protocols libdecor-0-dev             libx11-xcb-dev libxcb1-dev libxcb-randr0-dev libxcb-xinerama0-dev             libxcb-xkb-dev libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev

      - name: Install Mono 6.12
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Join-Path $env:TEMP "mono-6.12.0.199-x64.msi"
          Invoke-WebRequest "https://download.mono-project.com/archive/6.12.0/windows-installer/mono-6.12.0.199-x64-0.msi" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait
          & "C:\Program Files\Mono\bin\mono.exe" --version

      - name: Install Mono (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mono-devel libmono-2.0-dev

      - name: Build C# Player scripts
        working-directory: engine
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build_mono.ps1

      - name: Build Player runtime and builder
        working-directory: engine
        shell: pwsh
        run: |
          cargo build -p hezhou-player --release --features window-host,mono-host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build -p hezhou-player --release --bin hezhou-player-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package capability demo Player
        shell: pwsh
        run: |
          $target = if ($IsWindows) { "windows" } elseif ($IsLinux) { "linux" } else { throw "unsupported" }
          $suffix = if ($IsWindows) { ".exe" } else { "" }
          $fixture = "engine/player/tests/fixtures/skinned"
          New-Item -ItemType Directory -Force build-temp | Out-Null
          $stage = "build-temp/player-stage"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$stage/scripts" | Out-Null
          Copy-Item "engine/scripts/bin/Mono/EditorScript.dll" "$stage/scripts/EditorScript.dll" -Force
          $monoStage = "$stage/runtime/mono"
          New-Item -ItemType Directory -Force "$monoStage/bin","$monoStage/lib","$monoStage/etc" | Out-Null
          if ($IsWindows) {
            Copy-Item "C:\Program Files\Mono\bin\*" "$monoStage/bin" -Recurse -Force -ErrorAction SilentlyContinue
            Copy-Item "C:\Program Files\Mono\etc\*" "$monoStage/etc" -Recurse -Force -ErrorAction SilentlyContinue
            Copy-Item "C:\Program Files\Mono\lib\mono\4.5" "$monoStage/lib/mono/4.5" -Recurse -Force -ErrorAction SilentlyContinue
            Copy-Item "C:\Program Files\Mono\lib\mono\4.5-api" "$monoStage/lib/mono/4.5-api" -Recurse -Force -ErrorAction SilentlyContinue
          } else {
            Copy-Item "/usr/lib/mono/4.5" "$monoStage/lib/mono/4.5" -Recurse -Force -ErrorAction SilentlyContinue
            Copy-Item "/usr/lib/x86_64-linux-gnu/libmono-2.0.so*" "$monoStage/lib/" -Force -ErrorAction SilentlyContinue
            Copy-Item "/etc/mono/*" "$monoStage/etc" -Recurse -Force -ErrorAction SilentlyContinue
          }
          $config = Get-Content "$fixture/build-config.json" -Raw | ConvertFrom-Json
          $config.target = $target
          $config.product_name = "Hezhou Capability Demo"
          $config.executable_name = "hezhou-capability-demo"
          $config.window.title = "Hezhou Capability Demo"
          $config | ConvertTo-Json -Depth 8 | Set-Content "build-temp/player-demo-config.json" -Encoding utf8
          & "engine/target/release/hezhou-player-build$suffix" `
            --config "build-temp/player-demo-config.json" `
            --cook "$fixture/cook_manifest.json" `
            --assets-dir "$fixture/assets" `
            --scripts-dir "$stage/scripts" `
            --runtime-dir "$stage/runtime" `
            --exe "engine/target/release/hezhou-player$suffix" `
            --build-out "dist/player-demo"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pkg = "dist/player-demo/$target"
          & "$pkg/hezhou-capability-demo$suffix" --validate --player-root $pkg --log-dir "$env:RUNNER_TEMP/hezhou-player-demo-logs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Archive Windows Player
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/player-demo/windows/*" -DestinationPath "dist/hezhou-capability-player-windows.zip"

      - name: Archive Linux Player
        if: runner.os == 'Linux'
        shell: bash
        run: tar -C dist/player-demo/linux -czf dist/hezhou-capability-player-linux.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: hezhou-player-demo-${{ matrix.os }}
          path: |
            dist/hezhou-capability-player-*

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-windows, package-linux, package-player]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: hezhou-*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.msix
            artifacts/**/*.cer
            artifacts/**/*.msi
            artifacts/**/*.deb
            artifacts/**/hezhou-capability-player-*
