name: CI

on:
  push:
  pull_request:

jobs:
  rust-tests:
    runs-on: windows-latest
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "1"
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust unit/integration tests
        working-directory: engine
        run: cargo test -j 1 -p hezhou-core -p hezhou-ui -p hezhou-dfx

      - name: FFI contract
        working-directory: engine
        run: python scripts/check_ffi_contract.py

      - name: Fuzz harness check
        working-directory: engine
        run: cargo check --manifest-path fuzz/Cargo.toml

  csharp-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Mono
        run: choco install mono --no-progress -y

      - name: Compile editor C# scripts
        run: powershell -ExecutionPolicy Bypass -File engine/scripts/build_mono.ps1
