[package]
name = "hezhou-mcp"
version.workspace = true
edition.workspace = true
description = "MCP (Model Context Protocol) server for Hezhou game engine — LLM integration layer"

[features]
default = ["rust-bridge"]
# 纯Rust bridge — 可脱离编辑器独立运行，直接调用core/ui crate API
rust-bridge = ["dep:hezhou-core", "dep:hezhou-ui"]
# C# FFI bridge — 需要编辑器+Mono运行时，通过FfiContext调用C#层
ffi-bridge = ["dep:hezhou-scripting"]
# 同时启用两条路径(编辑器内嵌模式)
full = ["rust-bridge", "ffi-bridge"]

[dependencies]
# MCP协议SDK (官方Rust实现)
rmcp = { version = "1.7.0", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server", "tower"] }
tokio = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
http = "1"
axum = "0.8"
hezhou-dfx = { path = "../dfx" }

# 纯Rust路径依赖 (可选)
hezhou-core = { path = "../core", optional = true }
hezhou-ui = { path = "../ui", optional = true }

# C# FFI路径依赖 (可选)
hezhou-scripting = { path = "../scripting", optional = true }