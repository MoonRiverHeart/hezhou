[package]
name = "hezhou-player"
version.workspace = true
edition.workspace = true
description = "Hezhou Player 导出构建器与最小运行时（Windows + Linux）"
default-run = "hezhou-player"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 复用 asset crate 的 CookManifest/AssetId/AssetKind 契约，不另写不兼容 schema。
# 关闭默认 gltf feature：Player 只消费 cook 产物（JSON/原始资产），不需要 glTF 解析器。
hezhou-asset = { path = "../asset", default-features = false }

# hezhou-core：起始场景加载（manifest.start_scene 的 Project JSON → Scene）。
# 默认构建就需要（`--validate` 也会校验/加载起始场景），因此不作为可选依赖。
hezhou-core = { path = "../core" }

# hezhou-animation：蒙皮资产消费（ImportedPrimitive → SkinnedVertex、joint palette 计算）。
# 默认构建就需要（CPU 转换/palette 单测），不依赖渲染 crate。
hezhou-animation = { path = "../animation" }

# 可选：真实窗口渲染 host（feature = window-host）。默认构建不编译这些依赖。
# - rhi-vulkan 内部通过 GLFW + Vulkan 创建窗口/渲染器（UIVulkanRenderer）；
# - platform 作为窗口/输入抽象的契约依赖保留（当前窗口由 UIVulkanRenderer 管理，
#   Player 不重复初始化 GLFW，避免两个 GLFW 实例冲突）。
hezhou-rhi-vulkan = { path = "../rhi-vulkan", optional = true }
hezhou-platform = { path = "../platform", optional = true }

# 可选：C# 游戏逻辑入口（feature = mono-host，依赖 Mono JIT）。
# 使用 hezhou-scripting 的 Mono ScriptManager 加载包内 scripts/*.dll 并调用
# Hezhou.PlayerGame.Initialize/Update/Shutdown；默认构建不链接 Mono。
hezhou-scripting = { path = "../scripting", default-features = false, features = ["mono"], optional = true }

[features]
default = []
window-host = ["dep:hezhou-rhi-vulkan", "dep:hezhou-platform"]
# mono-host 依赖窗口 host（C# Update 在渲染帧循环中驱动）。
mono-host = ["window-host", "dep:hezhou-scripting"]

[[bin]]
name = "hezhou-player"
path = "src/main.rs"

[[bin]]
name = "hezhou-player-build"
path = "src/bin/player_build.rs"
