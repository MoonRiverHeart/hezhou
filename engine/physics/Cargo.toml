[package]
name = "hezhou-physics"
version = "0.1.0"
edition = "2021"

[lib]
name = "hezhou_physics"
path = "src/lib.rs"

# 自研动作物理：不引入 rapier/PhysX 等第三方物理引擎（ADR-002）。
# nalgebra 仅用于刚体旋转的表示（与 hezhou-core 的数学类型互补）。
[dependencies]
hezhou-core = { path = "../core" }
nalgebra = "0.32"

