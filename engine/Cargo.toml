[workspace]
resolver = "2"
members = [
    "scripting",
    "harmony",
    "core",
    "render",
    "platform",
    "dfx",
    "examples",
    "geometry",
    "rhi",
    "rhi-vulkan",
    "physics",
    "ui",
    "mcp",
    "render-pipeline",
    "player",
    "integration",
    "animation",
    "gameplay",
    "asset",
    "audio",
]

[workspace.package]
version = "0.3.0"
edition = "2021"

[workspace.dependencies]
parking_lot = "0.12"
tokio = { version = "1", features = ["rt", "sync", "time"] }
wrapped_mono = "0.3.1"